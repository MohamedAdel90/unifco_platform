x-app-env: &app-env
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_URL: http://localhost:8080
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: unifco
  DB_USERNAME: unifco
  DB_PASSWORD: unifco_staging
  QUEUE_CONNECTION: database

services:
  app:
    build: .
    ports: ["8080:8080"]
    environment: *app-env
    depends_on:
      mysql: {condition: service_healthy}
  queue:
    build: .
    command: ["php","artisan","queue:work","database","--sleep=1","--tries=3","--timeout=90"]
    environment: *app-env
    depends_on:
      mysql: {condition: service_healthy}
  scheduler:
    build: .
    command: ["php","artisan","schedule:work"]
    environment: *app-env
    depends_on:
      mysql: {condition: service_healthy}
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: unifco
      MYSQL_USER: unifco
      MYSQL_PASSWORD: unifco_staging
      MYSQL_ROOT_PASSWORD: unifco_staging_root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uunifco -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["mysqldata:/var/lib/mysql"]
volumes:
  mysqldata:
