x-app-env: &app-env
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: unifco
  DB_USERNAME: unifco
  DB_PASSWORD: unifco_staging
  QUEUE_CONNECTION: database

services:
  app:
    build: .
    ports: ["8080:8080"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
  queue:
    build: .
    command: ["php","artisan","queue:work","database","--sleep=1","--tries=3","--timeout=90"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
  scheduler:
    build: .
    command: ["php","artisan","schedule:work"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unifco
      POSTGRES_USER: unifco
      POSTGRES_PASSWORD: unifco_staging
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U unifco -d unifco"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
