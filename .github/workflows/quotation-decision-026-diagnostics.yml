name: Quotation Decision 026 Read-only Diagnostics
on:
  push:
    branches: [diagnostics/quotation-decision-026]
    paths: [.github/workflows/quotation-decision-026-diagnostics.yml]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployed quotation and workflow identifiers
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_readonly_key"
          chmod 600 "$HOME/.ssh/unifco_readonly_key"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i "$HOME/.ssh/unifco_readonly_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/unifco_platform && php" <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo 'DEPLOYED_SHA='.trim(shell_exec('git rev-parse HEAD')).PHP_EOL;
          foreach ([22,28] as $id) {
              $sr=App\Models\ServiceRequest::withoutGlobalScopes()->find($id);
              echo 'REQUEST '.json_encode($sr?->only(['id','tenant_id','quotation_id','workflow_key','workflow_stage','status','approval_state'])).PHP_EOL;
              echo 'STEPS '.json_encode(App\Models\ApprovalRequest::withoutGlobalScopes()->where('entity_id',$id)->orderBy('step_order')->get(['id','tenant_id','entity_type','entity_id','action','workflow_key','step_order','status','approval_role','assigned_user_id'])->toArray()).PHP_EOL;
              if ($sr?->quotation_id) echo 'QUOTE '.json_encode(App\Models\CrmQuotation::withoutGlobalScopes()->find($sr->quotation_id)?->only(['id','tenant_id','customer_id','status','amount'])).PHP_EOL;
          }
          foreach (['app/Http/Controllers/CustomerPortalOperationsController.php','app/Services/ServiceRequestWorkflowService.php'] as $path) echo 'SOURCE '.$path.' '.hash_file('sha256',$path).PHP_EOL;
          PHP
