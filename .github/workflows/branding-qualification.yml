name: Dynamic Branding Qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Admin/BrandingController.php'
      - 'app/Http/Controllers/BrandAssetController.php'
      - 'app/Http/Controllers/PublicServiceController.php'
      - 'app/Http/Middleware/BrandingPresentation.php'
      - 'app/Http/Middleware/PublicServiceLinks.php'
      - 'app/Models/BrandingSetting.php'
      - 'bootstrap/app.php'
      - 'resources/views/admin/branding/**'
      - 'resources/views/public/service-detail.blade.php'
      - 'routes/navigation.php'
      - 'routes/brand.php'
      - 'routes/services.php'
      - 'database/migrations/2026_08_23_000047_create_branding_settings.php'
      - 'tests/Feature/BrandingSettingsTest.php'
      - 'tests/Feature/PublicServiceDetailsTest.php'
      - '.github/workflows/branding-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Qualify dynamic branding and public services
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            rm -f database/database.sqlite
            touch database/database.sqlite
            php artisan key:generate --force
            php -l app/Http/Controllers/Admin/BrandingController.php
            php -l app/Http/Controllers/BrandAssetController.php
            php -l app/Http/Controllers/PublicServiceController.php
            php -l app/Http/Middleware/BrandingPresentation.php
            php -l app/Http/Middleware/PublicServiceLinks.php
            php -l app/Models/BrandingSetting.php
            php -l bootstrap/app.php
            php -l routes/services.php
            php -l database/migrations/2026_08_23_000047_create_branding_settings.php
            php artisan migrate:fresh --force
            php artisan route:list --name=admin.branding.index >/dev/null
            php artisan route:list --name=brand.logo >/dev/null
            php artisan route:list --name=public.services.show >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/BrandingSettingsTest.php tests/Feature/PublicServiceDetailsTest.php tests/Feature/SidebarNavigationTest.php tests/Feature/UserAdministrationTest.php
          ) > >(tee /tmp/branding.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/branding-latest.txt
          tail -n 500 /tmp/branding.log > deploy/status/branding-qualification.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/branding-latest.txt deploy/status/branding-qualification.log
          git commit -m 'Record dynamic branding qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail if qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
