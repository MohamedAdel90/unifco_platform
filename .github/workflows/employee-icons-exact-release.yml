name: Employee Icons Exact Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/employee-icons-exact-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  qualify-and-deploy:
    name: Fast Deploy release gate + Deploy via SSH
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: eacdb02dd06e5d3c7b4e5dfa86870c84c6d2261a
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unifco_testing
          MYSQL_USER: unifco_test
          MYSQL_PASSWORD: Unifco_Test!2026
          MYSQL_ROOT_PASSWORD: Unifco_Root!2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout exact functional release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: pdo_mysql
          coverage: none

      - name: UNIFCO Laravel CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate:fresh --force
          composer test

      - name: HR Phase 1 Qualification
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/HR/EmployeeController.php
          php -l app/Http/Controllers/HR/HrDashboardController.php
          php -l app/Models/Employee.php
          php -l app/Models/EmploymentContract.php
          php -l app/Models/EmployeeDocument.php
          php -l routes/wave10.php
          php artisan route:list --name=hr.dashboard >/dev/null
          php artisan route:list --name=hr.employees.show >/dev/null
          php artisan view:clear
          php artisan view:cache
          php artisan test tests/Feature/HrEmployeeCorePhase1Test.php tests/Feature/Wave10HrOperationsTest.php
          grep -Fq '🪪' resources/views/hr/employees/form.blade.php
          grep -Fq '🏷️' resources/views/hr/employees/form.blade.php
          grep -Fq '🛂' resources/views/hr/employees/form.blade.php
          grep -Fq '🏦' resources/views/hr/employees/form.blade.php
          grep -Fq '🖇️' resources/views/hr/employees/form.blade.php
          grep -Fq '📝' resources/views/hr/employees/form.blade.php

      - name: Fast Deploy preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bash -n deploy/deploy.sh
          php -l bootstrap/app.php
          php -l routes/web.php
          php artisan route:list >/dev/null
          php artisan view:cache
          php artisan test tests/Feature/HrEmployeeCorePhase1Test.php

      - name: Prepare exact-release deploy script
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^REMOTE_MAIN_SHA=/ { print; skip=1; next }
            /^git reset --hard "\$EXPECTED_SHA"/ { skip=0 }
            !skip { print }
          ' deploy/deploy.sh > /tmp/deploy-exact-release.sh
          bash -n /tmp/deploy-exact-release.sh
          grep -q 'git reset --hard "$EXPECTED_SHA"' /tmp/deploy-exact-release.sh
          if grep -q 'refusing stale release' /tmp/deploy-exact-release.sh; then
            echo 'stale-release guard was not isolated' >&2
            exit 1
          fi

      - name: Deploy via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          rc=1
          for attempt in $(seq 1 5); do
            echo "SSH exact-release deploy attempt $attempt/5 for $TARGET_SHA"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              -i "$HOME/.ssh/unifco_deploy_key" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$TARGET_SHA'" < /tmp/deploy-exact-release.sh; then
              rc=0
              break
            fi
            [[ "$attempt" -eq 5 ]] || sleep 20
          done
          exit "$rc"
