name: Asset Phase C Qualification

on:
  push:
    branches: [main, 'implementation/**']
    paths:
      - 'app/Http/Controllers/Maintenance/AssetCustodyController.php'
      - 'app/Models/AssetCustody.php'
      - 'app/Models/AssetTransfer.php'
      - 'app/Services/AssetCustodyService.php'
      - 'database/migrations/*asset_custody*'
      - 'resources/views/maintenance/asset-master/custody.blade.php'
      - 'routes/asset-master.php'
      - 'tests/Feature/AssetCustodyPhaseCTest.php'
      - '.github/workflows/asset-phase-c-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: unifco_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, pdo_mysql', coverage: none }
      - name: Prepare writable directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs && chmod -R 777 bootstrap/cache storage
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=unifco_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php artisan migrate --force
      - name: Run Phase A B C asset tests
        run: php artisan test tests/Feature/ProfessionalAssetMasterTest.php tests/Feature/AssetLifecyclePhaseBTest.php tests/Feature/AssetCustodyPhaseCTest.php
