name: Recover Production App

on:
  push:
    branches: [main]
    paths:
      - 'deploy/recover-production.trigger'
      - '.github/workflows/recover-production-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-production-app
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover application service
        id: recover
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set +e
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_recover_key"
          chmod 600 "$HOME/.ssh/unifco_recover_key"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i "$HOME/.ssh/unifco_recover_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE' > /tmp/unifco-recovery.log 2>&1
          set -euo pipefail
          cd /var/www/unifco_platform
          echo "==> Recovery fetch main"
          git fetch origin main
          git reset --hard origin/main
          echo "server_sha=$(git rev-parse HEAD)"
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache || true
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          supervisorctl stop unifco-app || true
          sleep 2
          if command -v fuser >/dev/null 2>&1; then fuser -k 8081/tcp || true; else pkill -f 'php.*artisan serve.*8081' || true; pkill -f 'php -S .*8081' || true; fi
          sleep 2
          supervisorctl reread || true
          supervisorctl update || true
          supervisorctl start unifco-app
          ready=0
          for attempt in $(seq 1 30); do if curl -fsSI http://127.0.0.1:8081/login >/dev/null; then ready=1; break; fi; sleep 2; done
          supervisorctl status unifco-app || true
          if [ "$ready" -ne 1 ]; then supervisorctl tail -100 unifco-app stderr || true; exit 1; fi
          php artisan migrate:status | grep -q '000049_rebuild_public_request_single_page'
          php artisan route:list --name=public.request-service >/dev/null
          php artisan route:list --name=public.request.store >/dev/null
          php artisan route:list --name=public.request.received >/dev/null
          echo "==> Verify request page reuses homepage header except login"
          request_html="$(curl -fsS http://127.0.0.1:8081/request-service)"
          grep -q 'خدمة أسرع تبدأ بطلب أوضح' <<< "$request_html"
          grep -q 'class="top request-homepage-header"' <<< "$request_html"
          grep -q 'class="wrap nav"' <<< "$request_html"
          grep -q 'class="brand-link"' <<< "$request_html"
          grep -q 'class="site-logo-frame"' <<< "$request_html"
          grep -q 'class="brand-copy"' <<< "$request_html"
          grep -q 'class="nav-links"' <<< "$request_html"
          grep -q 'class="nav-actions"' <<< "$request_html"
          grep -q 'class="btn red"' <<< "$request_html"
          grep -q '>طلب خدمة<' <<< "$request_html"
          ! grep -q 'تسجيل الدخول' <<< "$request_html"
          ! grep -q 'class="request-pill"' <<< "$request_html"
          ! grep -q 'class="primary-nav"' <<< "$request_html"
          grep -q 'عرض سعر قطع غيار' <<< "$request_html"
          grep -q 'خدمات الصيانة العادية' <<< "$request_html"
          grep -q 'public-request-camera-attachments' <<< "$request_html"
          request_en_html="$(curl -fsS 'http://127.0.0.1:8081/request-service?lang=en')"
          grep -q 'A faster service starts with a clearer request' <<< "$request_en_html"
          grep -q '>Request Service<' <<< "$request_en_html"
          grep -q '>Home<' <<< "$request_en_html"
          grep -q '>About Us<' <<< "$request_en_html"
          grep -q '>Services<' <<< "$request_en_html"
          grep -q '>Our Clients<' <<< "$request_en_html"
          grep -q '>Projects<' <<< "$request_en_html"
          grep -q '>Careers<' <<< "$request_en_html"
          grep -q '>Contact us<' <<< "$request_en_html"
          ! grep -q '>Sign In<' <<< "$request_en_html"
          grep -q 'Take Photo' <<< "$request_en_html"
          echo "recovery_result=success"
          REMOTE
          rc=$?
          cat /tmp/unifco-recovery.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record recovery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.recover.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\nrecovery_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/user-admin-production-latest.txt
          tail -n 520 /tmp/unifco-recovery.log > deploy/status/user-admin-production.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/user-admin-production-latest.txt deploy/status/user-admin-production.log
          git commit -m 'Record production recovery verification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail if recovery failed
        if: always() && steps.recover.outputs.rc != '0'
        run: exit 1
