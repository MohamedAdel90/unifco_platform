name: Recover Production App

on:
  push:
    branches: [main]
    paths:
      - 'deploy/recover-production.trigger'
      - '.github/workflows/recover-production-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-production-app
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover application service
        id: recover
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set +e
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_recover_key"
          chmod 600 "$HOME/.ssh/unifco_recover_key"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i "$HOME/.ssh/unifco_recover_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE' > /tmp/unifco-recovery.log 2>&1
          set -euo pipefail
          cd /var/www/unifco_platform
          echo "==> Recovery fetch main"
          git fetch origin main
          git reset --hard origin/main
          echo "server_sha=$(git rev-parse HEAD)"
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache || true
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          supervisorctl stop unifco-app || true
          sleep 2
          if command -v fuser >/dev/null 2>&1; then fuser -k 8081/tcp || true; else pkill -f 'php.*artisan serve.*8081' || true; pkill -f 'php -S .*8081' || true; fi
          sleep 2
          supervisorctl reread || true
          supervisorctl update || true
          supervisorctl start unifco-app
          ready=0
          for attempt in $(seq 1 30); do if curl -fsSI http://127.0.0.1:8081/login >/dev/null; then ready=1; break; fi; sleep 2; done
          supervisorctl status unifco-app || true
          if [ "$ready" -ne 1 ]; then supervisorctl tail -100 unifco-app stderr || true; exit 1; fi
          echo "==> Verify HR release migrations and routes"
          php artisan migrate:status | grep -q '000037_expand_hr_employee_core'
          php artisan migrate:status | grep -q '000038_build_hr_attendance_leave_phase2'
          php artisan migrate:status | grep -q '000039_build_hr_payroll_phase3'
          php artisan migrate:status | grep -q '000040_build_hr_business_trips_phase4'
          php artisan migrate:status | grep -q '000041_build_hr_end_of_service_phase5'
          php artisan migrate:status | grep -q '000042_build_hr_recruitment_phase6'
          php artisan migrate:status | grep -q '000043_build_hr_performance_phase7'
          php artisan route:list --name=hr.dashboard >/dev/null
          php artisan route:list --name=hr.employees.show >/dev/null
          php artisan route:list --name=hr.attendance.index >/dev/null
          php artisan route:list --name=hr.leave.index >/dev/null
          php artisan route:list --name=hr.payroll.index >/dev/null
          php artisan route:list --name=hr.missions.index >/dev/null
          php artisan route:list --name=hr.settlements.index >/dev/null
          php artisan route:list --name=hr.recruitment.index >/dev/null
          php artisan route:list --name=hr.performance.index >/dev/null
          php artisan route:list --name=hr.self-service.index >/dev/null
          php artisan route:list --name=hr.self-service.leave.store >/dev/null
          php artisan route:list --name=hr.self-service.missions.store >/dev/null
          php artisan route:list --name=hr.self-service.goals.update >/dev/null
          php artisan route:list --name=hr.manager-self-service.index >/dev/null
          php artisan route:list --name=hr.manager-self-service.leave.decide >/dev/null
          php artisan route:list --name=hr.manager-self-service.missions.decide >/dev/null
          echo "==> Verify HR authenticated pages resolve to auth gate"
          for path in dashboard attendance leave payroll missions settlements recruitment performance self-service manager-self-service; do
            curl -fsSI "http://127.0.0.1:8081/hr/$path" | grep -Eq 'HTTP/.* (200|302)'
          done
          echo "recovery_result=success"
          REMOTE
          rc=$?
          cat /tmp/unifco-recovery.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record recovery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.recover.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\nrecovery_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/user-admin-production-latest.txt
          tail -n 380 /tmp/unifco-recovery.log > deploy/status/user-admin-production.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/user-admin-production-latest.txt deploy/status/user-admin-production.log
          git commit -m 'Record production recovery verification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail if recovery failed
        if: always() && steps.recover.outputs.rc != '0'
        run: exit 1
