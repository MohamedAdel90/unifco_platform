name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hero v10 source
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/hero/v10.part0
          test -s resources/hero/v10.part1
          test -s resources/hero/v10.part2
          test -s resources/hero/v10.part3
          test -s resources/hero/v10.part4
          test -s resources/hero/v10.part5
          cat resources/hero/v10.part0 \
              resources/hero/v10.part1 \
              resources/hero/v10.part2 \
              resources/hero/v10.part3 \
              resources/hero/v10.part4 \
              resources/hero/v10.part5 \
            | tr -d '\n\r ' \
            | base64 -d > /tmp/unifco-hero-v10.jpg
          test -s /tmp/unifco-hero-v10.jpg
          test "$(head -c 2 /tmp/unifco-hero-v10.jpg | od -An -tx1 | tr -d ' \n')" = "ffd8"
          test "$(tail -c 2 /tmp/unifco-hero-v10.jpg | od -An -tx1 | tr -d ' \n')" = "ffd9"
          echo "Hero v10 validated: $(stat -c '%s bytes' /tmp/unifco-hero-v10.jpg)"

      - name: Deploy via SSH with diagnostics
        id: deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set +e
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -i "$HOME/.ssh/unifco_deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash /var/www/unifco_platform/deploy/deploy.sh' \
            > /tmp/unifco-deploy.log 2>&1
          rc=$?
          cat /tmp/unifco-deploy.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record deployment result and diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          deploy_rc="${{ steps.deploy.outputs.rc }}"
          if [ "${{ steps.validate.outcome }}" = "success" ] && [ "${deploy_rc:-999}" = "0" ]; then
            result="success"
            failed_stage="none"
          elif [ "${{ steps.validate.outcome }}" != "success" ]; then
            result="failure"
            failed_stage="validate"
          else
            result="failure"
            failed_stage="deploy"
          fi
          printf 'release=hero-20260821-10\nsource_sha=%s\ndeployed_at=%s\nresult=%s\nvalidate=%s\ndeploy_rc=%s\nfailed_stage=%s\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" \
            "${{ steps.validate.outcome }}" "${deploy_rc:-unknown}" "$failed_stage" > deploy/status/latest.txt
          if [ -f /tmp/unifco-deploy.log ]; then
            tail -n 120 /tmp/unifco-deploy.log > deploy/status/deploy.log
          else
            printf 'No SSH deploy log was produced.\n' > deploy/status/deploy.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/latest.txt deploy/status/deploy.log
          git commit -m "Record hero v10 deploy diagnostics [skip ci]" || true
          git push origin HEAD:main

      - name: Fail workflow when deployment failed
        if: ${{ always() && (steps.validate.outcome != 'success' || steps.deploy.outputs.rc != '0') }}
        run: exit 1
