name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate electrical homepage release
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            public/images/home/hero-electrical.svg \
            public/images/home/facility-power.svg \
            public/images/home/generator.svg \
            public/images/home/ats.svg \
            public/images/home/transformer.svg \
            public/images/home/ups.svg \
            public/images/home/mv-switchgear.svg \
            public/images/home/sector-commercial.svg \
            public/images/home/sector-industrial.svg \
            public/images/home/sector-healthcare.svg \
            public/images/home/sector-education.svg \
            public/images/home/sector-government.svg \
            public/images/home/sector-warehouse.svg \
            public/images/home/sector-datacenter.svg; do
            test -s "$asset"
          done
          grep -q '/images/home/hero-electrical.svg' resources/views/public/home.blade.php
          ! grep -q 'الضيافة' resources/views/public/home.blade.php
          grep -q 'home-electrical-20260821-11' app/Http/Controllers/PublicSiteController.php

      - name: Deploy via SSH with diagnostics
        id: deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set +e
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -i "$HOME/.ssh/unifco_deploy_key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash /var/www/unifco_platform/deploy/deploy.sh' \
            > /tmp/unifco-deploy.log 2>&1
          rc=$?
          cat /tmp/unifco-deploy.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record temporary deployment diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc="${{ steps.deploy.outputs.rc }}"
          printf 'source_sha=%s\nvalidate=%s\ndeploy_rc=%s\nrecorded_at=%s\n' \
            "$GITHUB_SHA" "${{ steps.validate.outcome }}" "${rc:-unknown}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > deploy/status/latest.txt
          if [ -f /tmp/unifco-deploy.log ]; then
            tail -n 120 /tmp/unifco-deploy.log > deploy/status/deploy.log
          else
            printf 'No SSH deploy log produced.\n' > deploy/status/deploy.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/latest.txt deploy/status/deploy.log
          git commit -m "Record electrical homepage deploy diagnostics [skip ci]" || true
          git push origin HEAD:main

      - name: Fail workflow when deploy failed
        if: ${{ always() && (steps.validate.outcome != 'success' || steps.deploy.outputs.rc != '0') }}
        run: exit 1
