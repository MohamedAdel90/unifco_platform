name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP for source validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none

      - name: Validate EAM maintenance and customer portal source
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Models/Asset.php
          php -l app/Models/MaintenancePlan.php
          php -l app/Models/WorkOrder.php
          php -l app/Services/EAM/AssetHealthService.php
          php -l app/Http/Controllers/EAM/AssetController.php
          php -l app/Http/Controllers/EAM/AssetMeterController.php
          php -l app/Http/Controllers/EAM/AssetSparePartController.php
          php -l app/Http/Controllers/EAM/AssetReliabilityController.php
          php -l app/Http/Controllers/Maintenance/WorkOrderController.php
          php -l app/Http/Controllers/CustomerAssetReadController.php
          php -l app/Http/Controllers/CustomerPortalController.php
          php -l routes/public.php
          php -l routes/console.php
          php -l database/migrations/2026_08_21_000025_build_asset_master_phase_one.php
          php -l database/migrations/2026_08_21_000026_asset_templates_and_pm_foundation.php
          php -l database/migrations/2026_08_21_000027_add_asset_spare_parts_compatibility.php
          php -l database/migrations/2026_08_21_000028_add_work_order_execution_and_reliability.php
          php -l database/migrations/2026_08_21_000029_add_asset_health_and_replacement_intelligence.php
          grep -q 'GENERATOR' database/migrations/2026_08_21_000026_asset_templates_and_pm_foundation.php
          grep -q 'TRANSFORMER' database/migrations/2026_08_21_000026_asset_templates_and_pm_foundation.php
          grep -q 'UPS' database/migrations/2026_08_21_000026_asset_templates_and_pm_foundation.php
          grep -q 'MV_SWITCHGEAR' database/migrations/2026_08_21_000026_asset_templates_and_pm_foundation.php
          grep -q 'work_order_checklist_results' database/migrations/2026_08_21_000028_add_work_order_execution_and_reliability.php
          grep -q 'asset_failures' database/migrations/2026_08_21_000028_add_work_order_execution_and_reliability.php
          grep -q 'health_score' database/migrations/2026_08_21_000029_add_asset_health_and_replacement_intelligence.php
          grep -q 'PLAN_REPLACEMENT' app/Services/EAM/AssetHealthService.php
          grep -q 'unifco:generate-pm-work-orders' routes/console.php
          grep -q 'unifco:recalculate-asset-health' routes/console.php
          grep -q 'eam.assets.reliability.show' resources/views/eam/assets/index.blade.php
          grep -q 'maintenance.work-orders.checklist' resources/views/maintenance/work-orders/show.blade.php
          grep -q 'maintenance.work-orders.materials.store' resources/views/maintenance/work-orders/show.blade.php
          grep -q 'maintenance.work-orders.failures.store' resources/views/maintenance/work-orders/show.blade.php
          grep -q 'customer.asset.show' resources/views/customer/asset-detail.blade.php
          grep -q 'customer.work-orders.show' resources/views/customer/asset-detail.blade.php
          grep -q 'Asset Health' resources/views/customer/asset-detail.blade.php
          grep -q 'CUSTOMER SERVICE REPORT' resources/views/customer/work-order-detail.blade.php
          grep -q "customer-portal-20260821-5" app/Http/Controllers/CustomerPortalController.php
          ! grep -q "select('maintenance_materials\.\*'" app/Http/Controllers/CustomerPortalController.php
          grep -q "customer-portal-20260821-5" deploy/deploy.sh

      - name: Validate electrical homepage release
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            public/images/home/hero-electrical.svg \
            public/images/home/facility-power.svg \
            public/images/home/generator.svg \
            public/images/home/ats.svg \
            public/images/home/transformer.svg \
            public/images/home/ups.svg \
            public/images/home/mv-switchgear.svg \
            public/images/home/sector-commercial.svg \
            public/images/home/sector-industrial.svg \
            public/images/home/sector-healthcare.svg \
            public/images/home/sector-education.svg \
            public/images/home/sector-government.svg \
            public/images/home/sector-warehouse.svg \
            public/images/home/sector-datacenter.svg; do
            test -s "$asset"
          done
          grep -q '/images/home/hero-electrical.svg' resources/views/public/home.blade.php
          ! grep -q '<span>الضيافة</span>' resources/views/public/home.blade.php
          grep -q 'home-electrical-20260821-12' app/Http/Controllers/PublicSiteController.php

      - name: Deploy via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"

          for attempt in 1 2 3 4 5 6; do
            echo "SSH deploy attempt $attempt/6"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -i "$HOME/.ssh/unifco_deploy_key" \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'bash /var/www/unifco_platform/deploy/deploy.sh'; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          echo "ERROR: VPS SSH remained unavailable after retries"
          exit 1
