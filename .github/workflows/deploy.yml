name: Deploy to Server

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/status/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.sha }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unifco_testing
          MYSQL_USER: unifco_test
          MYSQL_PASSWORD: Unifco_Test!2026
          MYSQL_ROOT_PASSWORD: Unifco_Root!2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Confirm release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "Deploying release SHA: $TARGET_SHA"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: pdo_mysql
          coverage: none

      - name: Validate release source and deploy policy
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh
          php -l app/Http/Controllers/PublicSiteController.php
          php -l app/Http/Controllers/CustomerPortalController.php
          php -l app/Http/Controllers/Maintenance/AssetMasterController.php
          php -l app/Http/Controllers/Workflow/WorkflowWorkspaceController.php
          php -l app/Http/Controllers/HR/EmployeeController.php
          php -l app/Models/Employee.php
          php -l app/Services/AssetMasterService.php
          php -l bootstrap/app.php
          php -l routes/web.php
          php -l routes/asset-master.php
          test -s resources/views/workflow/workspace.blade.php
          test -s resources/views/maintenance/asset-master/index.blade.php
          test -s resources/views/maintenance/asset-master/show.blade.php
          test -s resources/views/hr/employees/form.blade.php
          grep -q 'deploy/status/\*' deploy/deploy.sh
          grep -q 'merge-base --is-ancestor' deploy/deploy.sh

      - name: Laravel release preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan migrate:fresh --force
          php artisan brand:materialize
          test -s public/images/unifco-logo.webp
          php artisan route:list --name=asset-master.index >/dev/null
          php artisan route:list --name=asset-master.show >/dev/null
          php artisan route:list --name=workflow.approvals.index >/dev/null
          php artisan route:list --name=hr.employees.create >/dev/null
          php artisan view:cache
          php artisan test \
            tests/Feature/HrEmployeeCorePhase1Test.php \
            tests/Feature/ProfessionalAssetMasterTest.php \
            tests/Feature/ProfessionalAssetMasterV2Test.php \
            tests/Feature/AssetLifecyclePhaseBTest.php \
            tests/Feature/PublicOfficialContactTest.php \
            tests/Feature/CustomerAcquisitionWorkflowTest.php \
            tests/Feature/CustomerPortalRbacPhase1Test.php \
            tests/Feature/CustomerPortalPhase2ActionCenterTest.php \
            tests/Feature/CustomerPortalAdvancedOperationsTest.php \
            tests/Feature/CustomerPortalAlertsAndReportsTest.php \
            tests/Feature/CustomerPortalTest.php \
            tests/Feature/PublicHomepageLocalizationTest.php \
            tests/Feature/ServiceRequestWorkflowTest.php \
            tests/Feature/WorkflowTestUsersSeederTest.php \
            tests/Feature/WorkflowRoleWorkspaceTest.php \
            tests/Feature/PublicRequestWizardTest.php \
            tests/Feature/PublicSiteGuestRequestsTest.php \
            tests/Feature/WorkOrderPartConsumptionTest.php \
            tests/Feature/WorkOrderPartRequestTest.php \
            tests/Feature/BrandIdentityTest.php \
            tests/Feature/BrandReleaseQualificationTest.php \
            tests/Feature/BrandingSettingsTest.php

      - name: Deploy via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          for secret_name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PORT; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required GitHub secret: ${secret_name}" >&2
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          rc=1
          for attempt in $(seq 1 5); do
            echo "SSH deploy attempt $attempt/5 for release SHA $TARGET_SHA"
            # Stream the qualified deploy policy itself to the server. This avoids
            # the bootstrap deadlock where an older server-side deploy.sh rejects
            # the commit that contains its own fix.
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              -i "$HOME/.ssh/unifco_deploy_key" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$TARGET_SHA'" < deploy/deploy.sh; then
              rc=0
              break
            fi
            [[ "$attempt" -eq 5 ]] || sleep 20
          done
          exit "$rc"
