name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unifco_testing
          MYSQL_USER: unifco_test
          MYSQL_PASSWORD: Unifco_Test!2026
          MYSQL_ROOT_PASSWORD: Unifco_Root!2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: pdo_mysql
          coverage: none

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/PublicSiteController.php
          php -l app/Http/Controllers/CustomerPortalController.php
          php -l app/Http/Controllers/CustomerPortalOperationsController.php
          php -l app/Http/Controllers/CustomerPortalAccessAdminController.php
          php -l app/Http/Controllers/CustomerActionCenterController.php
          php -l app/Http/Controllers/CustomerPortalPhase2ActionController.php
          php -l app/Http/Controllers/CustomerWorkAcceptanceController.php
          php -l app/Http/Controllers/CustomerAssetReadController.php
          php -l app/Http/Controllers/CRM/CustomerAcquisitionController.php
          php -l app/Http/Controllers/Workflow/CustomerActionInboxController.php
          php -l app/Models/CustomerPortalActionRequest.php
          php -l app/Models/CrmLead.php
          php -l app/Models/Customer.php
          php -l app/Services/CustomerAcquisitionService.php
          php -l app/Services/CustomerPortalAccessService.php
          php -l app/Http/Controllers/Workflow/ApprovalController.php
          php -l app/Http/Controllers/Workflow/WorkflowWorkspaceController.php
          php -l app/Http/Controllers/AuthController.php
          php -l app/Services/PublicRequestPipelineService.php
          php -l app/Services/ServiceRequestWorkflowService.php
          php -l app/Services/CustomerLifecycleService.php
          php -l app/Services/ApprovalService.php
          php -l app/Http/Middleware/WorkflowRoleHomeRedirect.php
          php -l app/Http/Middleware/WorkflowRoleNavigationPresentation.php
          php -l app/Http/Middleware/CustomerPortalDashboardPresentation.php
          php -l database/seeders/WorkflowTestUsersSeeder.php
          php -l database/migrations/2026_08_27_000052_add_customer_portal_rbac_scopes.php
          php -l database/migrations/2026_08_27_000053_add_customer_portal_action_requests.php
          php -l database/migrations/2026_08_27_000054_add_customer_action_attachments.php
          php -l database/migrations/2026_08_27_000055_add_assignment_sla_to_customer_actions.php
          php -l database/migrations/2026_08_27_000056_add_customer_acquisition_lifecycle.php
          php -l database/migrations/2026_08_27_000057_add_acquisition_governance_fields.php
          php -l bootstrap/app.php
          php -l routes/web.php
          php -l routes/public.php
          php -l routes/customer-phase2.php
          php -l routes/customer-acquisition.php
          grep -q 'customer-portal-rbac-phase1-20260827' app/Http/Controllers/CustomerPortalController.php
          grep -q 'CustomerPortalAccessAdminController' routes/public.php
          grep -q 'customer.access.index' routes/public.php
          grep -q 'customer.actions' routes/customer-phase2.php
          grep -q 'workflow.customer-actions.index' routes/customer-phase2.php
          grep -q 'crm.acquisition.request-conversion' routes/customer-acquisition.php
          grep -q 'crm.acquisition.review-onboarding' routes/customer-acquisition.php
          grep -q 'conversion_approval_status' app/Services/CustomerAcquisitionService.php
          grep -q 'assigned_role' app/Http/Controllers/CustomerPortalPhase2ActionController.php
          grep -q 'workflow.site.manager@unifco.local' database/seeders/WorkflowTestUsersSeeder.php
          test -s resources/views/customer/users-access.blade.php
          test -s resources/views/customer/action-center.blade.php
          test -s resources/views/workflow/customer-actions.blade.php
          test -s resources/views/crm/acquisition.blade.php

      - name: Laravel release preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan migrate:fresh --force
          php artisan brand:materialize
          test -s public/images/unifco-logo.webp
          php artisan route:list --name=customer.portal >/dev/null
          php artisan route:list --name=customer.section >/dev/null
          php artisan route:list --name=customer.requests.store >/dev/null
          php artisan route:list --name=customer.access.index >/dev/null
          php artisan route:list --name=customer.access.store >/dev/null
          php artisan route:list --name=customer.access.update >/dev/null
          php artisan route:list --name=customer.actions >/dev/null
          php artisan route:list --name=customer.contracts.renewal-request >/dev/null
          php artisan route:list --name=customer.invoices.query >/dev/null
          php artisan route:list --name=customer.invoices.payment-proof >/dev/null
          php artisan route:list --name=customer.work-orders.revisit >/dev/null
          php artisan route:list --name=workflow.customer-actions.index >/dev/null
          php artisan route:list --name=crm.acquisition.index >/dev/null
          php artisan route:list --name=crm.acquisition.follow-up >/dev/null
          php artisan route:list --name=crm.acquisition.request-conversion >/dev/null
          php artisan route:list --name=crm.acquisition.review-conversion >/dev/null
          php artisan route:list --name=crm.acquisition.review-onboarding >/dev/null
          php artisan view:cache
          php artisan test \
            tests/Feature/CustomerAcquisitionWorkflowTest.php \
            tests/Feature/CustomerPortalRbacPhase1Test.php \
            tests/Feature/CustomerPortalPhase2ActionCenterTest.php \
            tests/Feature/CustomerPortalAdvancedOperationsTest.php \
            tests/Feature/CustomerPortalAlertsAndReportsTest.php \
            tests/Feature/CustomerPortalTest.php \
            tests/Feature/PublicHomepageLocalizationTest.php \
            tests/Feature/ServiceRequestWorkflowTest.php \
            tests/Feature/WorkflowTestUsersSeederTest.php \
            tests/Feature/WorkflowRoleWorkspaceTest.php \
            tests/Feature/PublicRequestWizardTest.php \
            tests/Feature/PublicSiteGuestRequestsTest.php \
            tests/Feature/WorkOrderPartConsumptionTest.php \
            tests/Feature/WorkOrderPartRequestTest.php \
            tests/Feature/BrandIdentityTest.php \
            tests/Feature/BrandReleaseQualificationTest.php \
            tests/Feature/BrandingSettingsTest.php

      - name: Deploy via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          rc=1
          for attempt in $(seq 1 5); do
            echo "SSH deploy attempt $attempt/5"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i "$HOME/.ssh/unifco_deploy_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash /var/www/unifco_platform/deploy/deploy.sh'; then rc=0; break; fi
            [ "$attempt" -eq 5 ] || sleep 20
          done
          exit "$rc"