name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unifco_testing
          MYSQL_USER: unifco_test
          MYSQL_PASSWORD: Unifco_Test!2026
          MYSQL_ROOT_PASSWORD: Unifco_Root!2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: pdo_mysql
          coverage: none

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/PublicSiteController.php
          php -l app/Http/Controllers/CustomerPortalController.php
          php -l app/Http/Controllers/Workflow/ApprovalController.php
          php -l app/Services/PublicRequestPipelineService.php
          php -l app/Services/ServiceRequestWorkflowService.php
          php -l app/Services/CustomerLifecycleService.php
          php -l app/Services/ApprovalService.php
          php -l app/Http/Middleware/BrandingPresentation.php
          php -l app/Http/Middleware/LegacyFormCompatibility.php
          php -l app/Http/Middleware/CustomerPortalDashboardPresentation.php
          php -l app/Http/Middleware/PublicAssetQrPresentation.php
          php -l app/Http/Middleware/PublicAssetQrInsecureFallback.php
          php -l app/Console/Commands/MaterializeBrandLogo.php
          php -l app/Console/Commands/CheckApprovalSla.php
          php -l database/seeders/WorkflowTestUsersSeeder.php
          php -l bootstrap/app.php
          php -l routes/public.php
          php -l routes/brand.php
          php -l routes/parts.php
          php -l routes/console.php
          php -l database/migrations/2026_08_26_000050_link_public_requests_to_asset_registry.php
          php -l database/migrations/2026_08_26_000051_build_service_request_workflow_foundation.php
          grep -q 'home-electrical-20260821-12' app/Http/Controllers/PublicSiteController.php
          grep -q 'customer-portal-20260826-workflow-1' app/Http/Controllers/CustomerPortalController.php
          grep -q 'public.asset.lookup' routes/public-asset-qr.php
          grep -q 'unifco:check-approval-sla' routes/console.php
          grep -q 'CUSTOMER_ADMIN' database/seeders/WorkflowTestUsersSeeder.php

      - name: Laravel release preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p database storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          composer install --no-interaction --prefer-dist --no-progress
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan migrate:fresh --force
          php artisan brand:materialize
          test -s public/images/unifco-logo.webp
          php artisan route:list --name=public.request.store >/dev/null
          php artisan route:list --name=public.asset.lookup >/dev/null
          php artisan route:list --name=customer.portal >/dev/null
          php artisan route:list --name=workflow.approvals.index >/dev/null
          php artisan route:list --name=inventory.part-requests.consume >/dev/null
          php artisan route:list --name=inventory.part-requests.return >/dev/null
          php artisan list | grep -q 'unifco:check-approval-sla'
          php artisan view:cache
          php artisan test \
            tests/Feature/PublicRequestWizardTest.php \
            tests/Feature/PublicSiteGuestRequestsTest.php \
            tests/Feature/ServiceRequestWorkflowTest.php \
            tests/Feature/WorkflowTestUsersSeederTest.php \
            tests/Feature/CustomerPortalAdvancedOperationsTest.php \
            tests/Feature/CustomerPortalTest.php \
            tests/Feature/WorkOrderPartConsumptionTest.php \
            tests/Feature/WorkOrderPartRequestTest.php \
            tests/Feature/BrandIdentityTest.php \
            tests/Feature/BrandReleaseQualificationTest.php \
            tests/Feature/BrandingSettingsTest.php

      - name: Deploy via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_deploy_key"
          chmod 600 "$HOME/.ssh/unifco_deploy_key"
          rc=1
          for attempt in $(seq 1 5); do
            echo "SSH deploy attempt $attempt/5"
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              -i "$HOME/.ssh/unifco_deploy_key" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'bash /var/www/unifco_platform/deploy/deploy.sh'; then
              rc=0
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 20
          done
          exit "$rc"
