name: Production Request Matrix Audit

on:
  push:
    branches: [main]
    paths:
      - 'app/Console/Commands/ProductionRequestMatrixAudit.php'
      - '.github/workflows/production-request-matrix-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment and audit production request matrix
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_matrix_key"
          chmod 600 "$HOME/.ssh/unifco_matrix_key"
          for attempt in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i "$HOME/.ssh/unifco_matrix_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"               "cd /var/www/unifco_platform && test -f app/Console/Commands/ProductionRequestMatrixAudit.php"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production deployment did not expose matrix audit command in time." >&2
              exit 1
            fi
            sleep 10
          done
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=20 -i "$HOME/.ssh/unifco_matrix_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"             "cd /var/www/unifco_platform && php artisan unifco:production-request-matrix-audit"
