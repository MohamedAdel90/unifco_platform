name: HR Phase 2 Qualification
# qualification retry after dashboard and regression alignment

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/HR/**'
      - 'app/Models/AttendanceEntry.php'
      - 'app/Models/LeaveRequest.php'
      - 'app/Models/WorkSchedule.php'
      - 'app/Models/LeavePolicy.php'
      - 'app/Models/EmployeeLeaveBalance.php'
      - 'resources/views/hr/**'
      - 'routes/wave10.php'
      - 'database/migrations/2026_08_23_000038_build_hr_attendance_leave_phase2.php'
      - 'tests/Feature/HrAttendanceLeavePhase2Test.php'
      - 'tests/Feature/HrEmployeeCorePhase1Test.php'
      - '.github/workflows/hr-phase2-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Qualify HR Phase 2
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            rm -f database/database.sqlite
            touch database/database.sqlite
            php artisan key:generate --force
            php -l app/Http/Controllers/HR/AttendanceController.php
            php -l app/Http/Controllers/HR/LeaveController.php
            php -l app/Models/AttendanceEntry.php
            php -l app/Models/LeaveRequest.php
            php -l app/Models/WorkSchedule.php
            php -l app/Models/LeavePolicy.php
            php -l app/Models/EmployeeLeaveBalance.php
            php -l routes/wave10.php
            php -l database/migrations/2026_08_23_000038_build_hr_attendance_leave_phase2.php
            php artisan migrate:fresh --force
            php artisan route:list --name=hr.attendance.index >/dev/null
            php artisan route:list --name=hr.leave.index >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/HrAttendanceLeavePhase2Test.php tests/Feature/HrEmployeeCorePhase1Test.php tests/Feature/Wave10HrOperationsTest.php
          ) > >(tee /tmp/hr-phase2.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/hr-phase2-latest.txt
          tail -n 280 /tmp/hr-phase2.log > deploy/status/hr-phase2-qualification.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/hr-phase2-latest.txt deploy/status/hr-phase2-qualification.log
          git commit -m 'Record HR Phase 2 qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail when qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
