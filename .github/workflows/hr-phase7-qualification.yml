name: HR Phase 7 Qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/HR/PerformanceController.php'
      - 'app/Models/PerformanceCycle.php'
      - 'app/Models/EmployeeGoal.php'
      - 'app/Models/PerformanceReview.php'
      - 'app/Models/ProbationReview.php'
      - 'app/Models/EmployeeDevelopmentItem.php'
      - 'app/Models/EmployeeSkill.php'
      - 'app/Models/CareerAction.php'
      - 'resources/views/hr/performance/**'
      - 'resources/views/dashboard/hr-phase7-navigation.blade.php'
      - 'routes/wave14.php'
      - 'routes/navigation.php'
      - 'bootstrap/app.php'
      - 'database/migrations/2026_08_23_000043_build_hr_performance_phase7.php'
      - 'tests/Feature/HrPerformancePhase7Test.php'
      - '.github/workflows/hr-phase7-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: unifco_testing, MYSQL_USER: unifco_test, MYSQL_PASSWORD: 'Unifco_Test!2026', MYSQL_ROOT_PASSWORD: 'Unifco_Root!2026'}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Qualify HR Phase 7
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            php artisan key:generate --force
            php -l app/Http/Controllers/HR/PerformanceController.php
            php -l app/Models/PerformanceCycle.php
            php -l app/Models/EmployeeGoal.php
            php -l app/Models/PerformanceReview.php
            php -l app/Models/ProbationReview.php
            php -l app/Models/EmployeeDevelopmentItem.php
            php -l app/Models/EmployeeSkill.php
            php -l app/Models/CareerAction.php
            php -l routes/wave14.php
            php -l database/migrations/2026_08_23_000043_build_hr_performance_phase7.php
            php artisan migrate:fresh --force
            php artisan route:list --name=hr.performance.index >/dev/null
            php artisan route:list --name=hr.performance.reviews.decide >/dev/null
            php artisan route:list --name=hr.performance.career.apply >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/HrPerformancePhase7Test.php tests/Feature/HrRecruitmentPhase6Test.php tests/Feature/HrEndOfServicePhase5Test.php tests/Feature/HrBusinessTripsPhase4Test.php tests/Feature/HrPayrollPhase3Test.php tests/Feature/HrAttendanceLeavePhase2Test.php tests/Feature/HrEmployeeCorePhase1Test.php tests/Feature/Wave10HrOperationsTest.php tests/Feature/SidebarNavigationTest.php
          ) > >(tee /tmp/hr-phase7.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/hr-phase7-latest.txt
          tail -n 500 /tmp/hr-phase7.log > deploy/status/hr-phase7-qualification.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/hr-phase7-latest.txt deploy/status/hr-phase7-qualification.log
          git commit -m 'Record HR Phase 7 qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail when qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
