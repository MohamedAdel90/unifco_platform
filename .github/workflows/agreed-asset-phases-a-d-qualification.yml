name: Agreed Asset Phases A-D Qualification
on:
  push:
    branches: [main, gap-closure-a-d-final]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unifco_testing
          MYSQL_USER: unifco_test
          MYSQL_PASSWORD: Unifco_Test!2026
          MYSQL_ROOT_PASSWORD: Unifco_Root!2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, simplexml
          coverage: none
      - name: Validate acceptance source
        run: |
          set -euo pipefail
          php -l app/Services/AssetMasterService.php
          php -l app/Services/AssetAcceptanceContractService.php
          php -l app/Services/CustomerAssetGovernanceService.php
          php -l app/Http/Controllers/Maintenance/AssetMasterController.php
          php -l database/migrations/2026_08_28_000100_close_asset_acceptance_contract.php
          php -l database/migrations/2026_08_28_000110_allow_staged_customer_pm_strategy.php
          grep -q "AST-UNF-" app/Services/AssetMasterService.php
          grep -q "Minimum Verification Data" app/Services/AssetMasterService.php
          grep -q "5000" app/Services/CustomerAssetGovernanceService.php
          grep -q "Impact × Probability" resources/views/maintenance/asset-master/show.blade.php
          grep -q "Full Component Traceability" resources/views/maintenance/asset-master/show.blade.php
      - name: Prepare Laravel
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
          php artisan view:cache
      - name: Test Professional Asset Master
        continue-on-error: true
        run: php artisan test tests/Feature/ProfessionalAssetMasterTest.php
      - name: Test Professional Coverage
        continue-on-error: true
        run: php artisan test tests/Feature/AgreedProfessionalAssetMasterCoverageTest.php
      - name: Test Lifecycle Phase B
        continue-on-error: true
        run: php artisan test tests/Feature/AssetLifecyclePhaseBTest.php
      - name: Test Maintenance Intelligence
        continue-on-error: true
        run: php artisan test tests/Feature/AssetMaintenanceIntelligenceTest.php
      - name: Test Custody Phase C
        continue-on-error: true
        run: php artisan test tests/Feature/AssetCustodyPhaseCTest.php
      - name: Test Warranty Phase D
        continue-on-error: true
        run: php artisan test tests/Feature/AssetWarrantyInsurancePhaseDTest.php
      - name: Test Agreed A-D
        continue-on-error: true
        run: php artisan test tests/Feature/AgreedAssetPhasesABCDTest.php
      - name: Test A-D Gap Closure
        continue-on-error: true
        run: php artisan test tests/Feature/AgreedAssetGapClosureABCDTest.php
      - name: Test Final Acceptance Contract
        continue-on-error: true
        run: php artisan test tests/Feature/AssetAcceptanceContractFinalTest.php
      - name: Test Creation Approval Bulk Duplicate Contract
        continue-on-error: true
        run: php artisan test tests/Feature/AssetCreationApprovalBulkDuplicateContractTest.php
      - name: Final all A-D gate
        run: php artisan test tests/Feature/ProfessionalAssetMasterTest.php tests/Feature/AgreedProfessionalAssetMasterCoverageTest.php tests/Feature/AssetLifecyclePhaseBTest.php tests/Feature/AssetMaintenanceIntelligenceTest.php tests/Feature/AssetCustodyPhaseCTest.php tests/Feature/AssetWarrantyInsurancePhaseDTest.php tests/Feature/AgreedAssetPhasesABCDTest.php tests/Feature/AgreedAssetGapClosureABCDTest.php tests/Feature/AssetAcceptanceContractFinalTest.php tests/Feature/AssetCreationApprovalBulkDuplicateContractTest.php
