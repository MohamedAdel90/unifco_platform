name: UNIFCO Staging Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-qualification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unifco_test
          POSTGRES_USER: unifco
          POSTGRES_PASSWORD: unifco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U unifco -d unifco_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: unifco_test
      DB_USERNAME: unifco
      DB_PASSWORD: unifco_test
      QUEUE_CONNECTION: database
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - name: Prepare Laravel
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
      - name: Validate migrations
        run: php artisan migrate:fresh --seed --force
      - name: Run full tests on PostgreSQL
        run: php artisan test
      - name: Validate scheduler
        run: php artisan schedule:list
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
