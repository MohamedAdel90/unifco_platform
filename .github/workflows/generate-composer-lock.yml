name: Generate Composer Lock

on:
  push:
    branches: [main]
    paths:
      - composer.json
      - .github/workflows/generate-composer-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Generate lock file
        shell: bash
        run: |
          set -euo pipefail
          composer update --no-interaction --prefer-dist --no-progress --no-scripts
          composer validate --no-interaction --no-check-publish
          test -s composer.lock
      - name: Verify PHP 8.3 platform compatibility
        shell: bash
        run: |
          set -euo pipefail
          composer check-platform-reqs --lock --no-dev || true
          php -r '$d=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR); if(($d["platform-overrides"]["php"] ?? null)!=="8.3.0"){fwrite(STDERR,"composer.lock is not pinned to PHP 8.3.0 platform\n"); exit(1);} echo "Composer platform override verified: PHP 8.3.0\n";'
      - name: Commit Composer lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate Composer lock for PHP 8.3'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload Composer lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-php83
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
