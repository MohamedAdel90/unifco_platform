name: Production Request Lifecycle Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/Console/Commands/ProductionRequestLifecycleEvidence.php'
      - 'app/Http/Controllers/CustomerPortalController.php'
      - 'tests/Feature/CustomerPortalAdvancedOperationsTest.php'
      - 'tests/Feature/ServiceRequestWorkflowTest.php'
      - 'database/migrations/*request*lifecycle*.php'
      - '.github/workflows/production-request-lifecycle-evidence.yml'

permissions:
  contents: read

concurrency:
  group: production-request-lifecycle-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for production release and collect read-only evidence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_DIR: /var/www/unifco_platform
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/unifco_evidence_key"
          chmod 600 "$HOME/.ssh/unifco_evidence_key"
          ssh_cmd=(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i "$HOME/.ssh/unifco_evidence_key" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST")
          ready=0
          for attempt in $(seq 1 40); do
            if "${ssh_cmd[@]}" "cd '$APP_DIR' && current=\$(git rev-parse HEAD) && { [ \"\$current\" = '$EXPECTED_SHA' ] || { git merge-base --is-ancestor '$EXPECTED_SHA' \"\$current\" && [ -z \"\$(git diff --name-only '$EXPECTED_SHA..'\"\$current\" | grep -v '^deploy/status/' || true)\" ]; }; }"; then
              ready=1
              break
            fi
            [[ "$attempt" -eq 40 ]] || sleep 15
          done
          [ "$ready" -eq 1 ] || { echo "Production did not reach the expected qualified release lineage: $EXPECTED_SHA"; exit 1; }
          "${ssh_cmd[@]}" "cd '$APP_DIR' && php artisan unifco:production-request-lifecycle-evidence"
