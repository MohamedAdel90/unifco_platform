name: Public Request Single Page Qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/PublicSiteController.php'
      - 'app/Models/PublicServiceRequest.php'
      - 'app/Services/PublicRequestPipelineService.php'
      - 'resources/views/public/request.blade.php'
      - 'resources/views/public/received.blade.php'
      - 'database/migrations/2026_08_24_000048_upgrade_public_request_experience.php'
      - 'database/migrations/2026_08_25_000049_rebuild_public_request_single_page.php'
      - 'tests/Feature/PublicRequestWizardTest.php'
      - '.github/workflows/public-request-wizard-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: unifco_testing
      DB_USERNAME: unifco_test
      DB_PASSWORD: Unifco_Test!2026
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_DATABASE: unifco_testing, MYSQL_USER: unifco_test, MYSQL_PASSWORD: 'Unifco_Test!2026', MYSQL_ROOT_PASSWORD: 'Unifco_Root!2026'}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uunifco_test -pUnifco_Test!2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Qualify single-page public request intake
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            php artisan key:generate --force
            php -l app/Http/Controllers/PublicSiteController.php
            php -l app/Models/PublicServiceRequest.php
            php -l app/Services/PublicRequestPipelineService.php
            php -l database/migrations/2026_08_24_000048_upgrade_public_request_experience.php
            php -l database/migrations/2026_08_25_000049_rebuild_public_request_single_page.php
            php artisan migrate:fresh --force
            php artisan route:list --name=public.request.store >/dev/null
            php artisan route:list --name=public.request.received >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/PublicRequestWizardTest.php
          ) > >(tee /tmp/public-request-wizard.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/public-request-wizard-latest.txt
          tail -n 500 /tmp/public-request-wizard.log > deploy/status/public-request-wizard.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/public-request-wizard-latest.txt deploy/status/public-request-wizard.log
          git commit -m 'Record public request qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail when qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
