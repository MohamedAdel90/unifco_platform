name: User Administration Qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Admin/UserAdministrationController.php'
      - 'app/Http/Controllers/NavigationWorkspaceController.php'
      - 'app/Services/AuthorizationService.php'
      - 'resources/views/navigation/users*.blade.php'
      - 'routes/navigation.php'
      - 'database/migrations/2026_08_22_000034_add_user_permission_overrides.php'
      - 'tests/Feature/UserAdministrationTest.php'
      - '.github/workflows/user-admin-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Prepare and test user administration
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            rm -f database/database.sqlite
            touch database/database.sqlite
            php artisan key:generate --force
            php -l app/Http/Controllers/Admin/UserAdministrationController.php
            php -l app/Services/AuthorizationService.php
            php -l routes/navigation.php
            php -l database/migrations/2026_08_22_000034_add_user_permission_overrides.php
            php artisan migrate:fresh --force
            php artisan route:list --name=admin.users.create >/dev/null
            php artisan route:list --name=admin.users.permission >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/UserAdministrationTest.php tests/Feature/SidebarNavigationTest.php
          ) > >(tee /tmp/user-admin-qualification.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/user-admin-latest.txt
          tail -n 220 /tmp/user-admin-qualification.log > deploy/status/user-admin-qualification.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/user-admin-latest.txt deploy/status/user-admin-qualification.log
          git commit -m 'Record user administration qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail when qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
