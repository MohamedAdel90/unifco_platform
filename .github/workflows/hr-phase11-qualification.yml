name: HR Phase 11 Qualification

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/HR/HrAnalyticsController.php'
      - 'app/Models/HrWorkforcePlan.php'
      - 'resources/views/hr/analytics/**'
      - 'resources/views/hr/dashboard.blade.php'
      - 'routes/wave18.php'
      - 'bootstrap/app.php'
      - 'database/migrations/2026_08_23_000046_build_hr_analytics_phase11.php'
      - 'tests/Feature/HrAnalyticsPhase11Test.php'
      - '.github/workflows/hr-phase11-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Qualify HR Phase 11
        id: test
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs database
            composer install --no-interaction --prefer-dist --no-progress
            cp .env.example .env
            rm -f database/database.sqlite
            touch database/database.sqlite
            php artisan key:generate --force
            php -l app/Http/Controllers/HR/HrAnalyticsController.php
            php -l app/Models/HrWorkforcePlan.php
            php -l routes/wave18.php
            php -l database/migrations/2026_08_23_000046_build_hr_analytics_phase11.php
            php artisan migrate:fresh --force
            php artisan route:list --name=hr.analytics.index >/dev/null
            php artisan route:list --name=hr.analytics.plans.store >/dev/null
            php artisan view:clear
            php artisan view:cache
            php artisan test tests/Feature/HrAnalyticsPhase11Test.php tests/Feature/HrCompliancePhase10Test.php tests/Feature/HrDocumentsPhase9Test.php tests/Feature/HrSelfServicePhase8Test.php tests/Feature/HrPerformancePhase7Test.php tests/Feature/HrRecruitmentPhase6Test.php tests/Feature/HrEndOfServicePhase5Test.php tests/Feature/HrBusinessTripsPhase4Test.php tests/Feature/HrPayrollPhase3Test.php tests/Feature/HrAttendanceLeavePhase2Test.php tests/Feature/HrEmployeeCorePhase1Test.php tests/Feature/Wave10HrOperationsTest.php tests/Feature/SidebarNavigationTest.php
          ) > >(tee /tmp/hr-phase11.log) 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          rc='${{ steps.test.outputs.rc }}'
          if [ "${rc:-999}" = '0' ]; then result=success; else result=failure; fi
          printf 'source_sha=%s\nverified_at=%s\nresult=%s\ntest_rc=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$result" "${rc:-not-run}" > deploy/status/hr-phase11-latest.txt
          tail -n 760 /tmp/hr-phase11.log > deploy/status/hr-phase11-qualification.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/status/hr-phase11-latest.txt deploy/status/hr-phase11-qualification.log
          git commit -m 'Record HR Phase 11 qualification [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Fail when qualification failed
        if: always() && steps.test.outputs.rc != '0'
        run: exit 1
